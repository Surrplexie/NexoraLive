<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NL Live Production Ops</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="operator-page">
  <header>
    <h1>Live Production Operations</h1>
    <p class="sub">Phase 7 — HTTPS, live Steam, VPS readiness — see <code>docs/NL_LIVE_PRODUCTION.md</code></p>
    <nav class="nav">
      <a href="/ga-ops.html">GA ops</a>
      <a href="/fleet-ops.html">Fleet ops</a>
      <a href="/ga.html">Streamer signup</a>
      <a href="/identity-link.html">Link Steam</a>
      <a href="/live-production-ops.html" aria-current="page">Live prod ops</a>
      <a href="/multigame-ops.html">Multi-game ops</a>

  <section class="card operator-panel">
    <h2>Operator key</h2>
    <label>NL_OPERATOR_KEY <input id="operator-key" type="password" autocomplete="off" /></label>
    <button type="button" id="save-key">Save key</button>
    <span id="key-status"></span>
  </section>

  <section class="card operator-panel">
    <h2>Live production status</h2>
    <pre id="status-block">Loading...</pre>
  </section>

  <section class="card operator-panel">
    <h2>Live production validation</h2>
    <p id="validation-summary"></p>
    <button type="button" id="run-validation">Run live production validation</button>
  </section>

  <script src="nl-auth.js"></script>
  <script src="live-production-ops-app.js"></script>
</body>
