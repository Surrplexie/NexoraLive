apiVersion: v1
kind: ConfigMap
metadata:
  name: nl-fleet-staging-env
  namespace: nl-fleet-staging
data:
  NL_FLEET_ENABLED: "true"
  NL_FLEET_MAX_CONCURRENT: "128"
  NL_FLEET_MIN_TWITCH_FOLLOWERS: "0"
  NL_FLEET_FORK_CREATE_RATE_PER_MIN: "200"
  NL_FLEET_MAX_FORK_CREATES_PER_HOUR: "9999"
  NL_FLEET_STAGING_DEV: "true"
  NL_FLEET_RELAY_WS_TEMPLATE: "wss://relay-{region}.staging.nl.example.com/fork/{session}"
  NL_FLEET_TURN_URI: "turn:turn.staging.nl.example.com:3478"
  NL_FORK_ORCHESTRATOR_ENABLED: "true"
  NL_FORK_ORCHESTRATOR_MODE: "kubernetes"
  NL_FORK_K8S_NAMESPACE: "nl-fork"
  NL_FORK_DOCKER_IMAGE: "nl-fork-hello:latest"
  NL_IDENTITY_ENABLED: "true"
  NL_OWNERSHIP_MODE: "mock"
