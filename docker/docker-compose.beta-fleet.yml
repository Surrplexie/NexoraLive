# Phase 5 — public beta fleet (production + live identity + waitlist)
#
#   powershell -File scripts/nl-beta-stack-up.ps1 -Validate
#
# See docs/NL_PUBLIC_BETA.md
services:
  session-host:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: session-host
    ports:
      - "27020:27020"
      - "27021:27021"
    env_file:
      - beta-fleet.env
    environment:
      NL_BIND: "0.0.0.0"
      NL_HTTP_PORT: "27020"
      NL_WS_PORT: "27021"
      NL_DATA_ROOT: "/data"
      NL_PUBLIC_BASE_URL: "https://127.0.0.1"
      NL_PUBLIC_MODE: "true"
      NL_FLEET_ENABLED: "true"
      NL_FLEET_MAX_CONCURRENT: "128"
      NL_FLEET_MIN_TWITCH_FOLLOWERS: "0"
      NL_FLEET_FORK_CREATE_RATE_PER_MIN: "200"
      NL_FLEET_MAX_FORK_CREATES_PER_HOUR: "9999"
      NL_FLEET_FORK_CREATE_P99_MS: "15000"
      NL_FLEET_STAGING_DEV: "false"
      NL_FLEET_PRODUCTION_READY: "true"
      NL_FLEET_RELAY_WS_TEMPLATE: "wss://127.0.0.1:8443/fork/{session}"
      NL_FLEET_TURN_URI: "turn:127.0.0.1:3478?transport=udp"
      NL_FORK_ORCHESTRATOR_ENABLED: "true"
      NL_FORK_ORCHESTRATOR_MODE: "docker"
      NL_FORK_DOCKER_IMAGE: "nl-fork-hello:latest"
      NL_FORK_DOCKER_HOST: "host.docker.internal"
      NL_IDENTITY_ENABLED: "true"
      NL_OWNERSHIP_MODE: "live"
      NL_BETA_ENABLED: "true"
      NL_BETA_WAITLIST_OPEN: "true"
      NL_BETA_MAX_STREAMERS: "100"
      NL_BETA_ENFORCE_ALLOWLIST: "true"
      NL_BETA_ALLOW_MOCK_IDENTITY: "true"
      NL_BETA_REQUIRE_PRODUCTION_READY: "false"
      NL_BETA_OPERATOR_STREAMERS: "beta-validate-streamer,dogfood-streamer"
    volumes:
      - ./beta-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:27020/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  relay-stub:
    image: caddy:2-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./relay-stub/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      session-host:
        condition: service_healthy

  edge:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./edge-staging/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      session-host:
        condition: service_healthy

  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --user=nl:beta-turn-secret
      - --realm=nl.beta
      - --no-cli
