# Phase 3 — hosted staging stack: session host + HTTPS edge + relay stub + coturn
#
#   docker compose -f docker/docker-compose.staging-fleet.yml up --build -d
#   powershell -File scripts/nl-staging-validate.ps1
#
# See docs/NL_STAGING_HOSTED.md
services:
  session-host:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: session-host
    ports:
      - "27020:27020"
      - "27021:27021"
    environment:
      NL_BIND: "0.0.0.0"
      NL_HTTP_PORT: "27020"
      NL_WS_PORT: "27021"
      NL_DATA_ROOT: "/data"
      NL_PUBLIC_BASE_URL: "https://127.0.0.1"
      NL_FLEET_ENABLED: "true"
      NL_FLEET_MAX_CONCURRENT: "128"
      NL_FLEET_MIN_TWITCH_FOLLOWERS: "0"
      NL_FLEET_FORK_CREATE_RATE_PER_MIN: "200"
      NL_FLEET_MAX_FORK_CREATES_PER_HOUR: "9999"
      NL_FLEET_STAGING_DEV: "true"
      NL_FLEET_RELAY_WS_TEMPLATE: "wss://127.0.0.1:8443/fork/{session}"
      NL_FLEET_TURN_URI: "turn:127.0.0.1:3478?transport=udp"
      NL_FORK_ORCHESTRATOR_ENABLED: "true"
      NL_FORK_ORCHESTRATOR_MODE: "mock"
      NL_IDENTITY_ENABLED: "true"
      NL_OWNERSHIP_MODE: "mock"
    volumes:
      - nl-staging-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:27020/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  relay-stub:
    image: caddy:2-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./relay-stub/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      session-host:
        condition: service_healthy

  edge:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./edge-staging/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      session-host:
        condition: service_healthy

  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --user=nl:staging-turn-secret
      - --realm=nl.staging
      - --no-cli

volumes:
  nl-staging-data:
