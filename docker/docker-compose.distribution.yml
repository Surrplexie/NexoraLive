# Phase 11 — player & streamer distribution (cutover + client packages + onboarding)
#
#   powershell -File scripts/nl-distribution-stack-up.ps1 -Validate
#
# See docs/NL_DISTRIBUTION.md
services:
  session-host:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: session-host
    ports:
      - "27020:27020"
      - "27021:27021"
    env_file:
      - distribution-fleet.env
    environment:
      NL_BIND: "0.0.0.0"
      NL_HTTP_PORT: "27020"
      NL_WS_PORT: "27021"
      NL_DATA_ROOT: "/data"
      NL_PUBLIC_BASE_URL: "https://127.0.0.1"
      NL_PUBLIC_MODE: "true"
      NL_HARDENING: "true"
      NL_FLEET_ENABLED: "true"
      NL_FLEET_MAX_CONCURRENT: "128"
      NL_FLEET_MIN_TWITCH_FOLLOWERS: "0"
      NL_FLEET_FORK_CREATE_RATE_PER_MIN: "30"
      NL_FLEET_MAX_FORK_CREATES_PER_HOUR: "6"
      NL_FLEET_STAGING_DEV: "false"
      NL_FLEET_PRODUCTION_READY: "true"
      NL_FLEET_MOD_RETENTION_DAYS: "730"
      NL_FLEET_RELAY_WS_TEMPLATE: "wss://127.0.0.1:8443/fork/{session}"
      NL_FLEET_TURN_URI: "turn:127.0.0.1:3478?transport=udp"
      NL_FORK_ORCHESTRATOR_ENABLED: "true"
      NL_FORK_ORCHESTRATOR_MODE: "docker"
      NL_FORK_DOCKER_IMAGE: "nl-fork-hello:latest"
      NL_FORK_DOCKER_HOST: "host.docker.internal"
      NL_FORK_CATALOG_ENABLED: "true"
      NL_FORK_CATALOG_MANIFEST: "/app/samples/fork/catalog.json"
      NL_IDENTITY_ENABLED: "true"
      NL_OWNERSHIP_MODE: "live"
      NL_BETA_ENABLED: "false"
      NL_GA_ENABLED: "true"
      NL_GA_OPEN_SIGNUP: "true"
      NL_GA_REQUIRE_LIVE_IDENTITY: "true"
      NL_GA_ALLOW_MOCK_IDENTITY: "false"
      NL_GA_REQUIRE_PRODUCTION_READY: "true"
      NL_GA_REQUIRE_BETA_DISABLED: "true"
      NL_GA_MIN_CATALOG_GAMES: "3"
      NL_GA_REQUIRED_GAMES: "hello-fork,minecraft,beamng"
      NL_GA_SLA_TIER: "standard"
      NL_LIVE_PRODUCTION_ENABLED: "true"
      NL_LIVE_PRODUCTION_DEV: "false"
      NL_MULTIGAME_PRODUCTION_ENABLED: "true"
      NL_MULTIGAME_REQUIRED_GAMES: "hello-fork,minecraft,beamng"
      NL_PARTNERSHIP_ENABLED: "true"
      NL_PARTNERSHIP_GATE_ADMIT: "1"
      NL_LAUNCH_OPS_ENABLED: "true"
      NL_LAUNCH_OPS_DEV: "false"
      NL_LAUNCH_STATUS_PAGE_ENABLED: "true"
      NL_LAUNCH_LEGAL_VERSION: "2026-08-01"
      NL_LAUNCH_BACKUP_ROOT: "/data/backups"
      NL_PRODUCTION_CUTOVER_ENABLED: "true"
      NL_PRODUCTION_CUTOVER_DEV: "true"
      NL_DISTRIBUTION_ENABLED: "true"
      NL_DISTRIBUTION_DEV: "true"
      NL_DISTRIBUTION_CLIENT_VERSION: "1.0.0"
      NL_DISTRIBUTION_WIN_PACKAGE: "downloads/nl-client-win-x64.zip"
    volumes:
      - ./distribution-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:27020/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  relay-stub:
    image: caddy:2-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./relay-production/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      session-host:
        condition: service_healthy

  edge:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./edge-production/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      session-host:
        condition: service_healthy

  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --user=nl:distribution-turn-secret
      - --realm=nl.distribution
      - --no-cli
