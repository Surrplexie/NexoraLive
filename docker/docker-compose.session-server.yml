# NL Session Server — networked operator stack (Phase D)
# Session Host web includes session bus + moderation + join admission on one HTTP port.
#
# For a public demo, copy .env.example → .env and set NL_PUBLIC_MODE=true plus secrets.
# Example public env (do not commit real secrets):
#   NL_PUBLIC_MODE=true
#   NL_BUS_TOKEN=<fixed-bridge-token>
#   NL_OPERATOR_KEY=<operator-api-key>
#   NL_CORS_ORIGINS=https://demo.example.com
#   NL_PUBLIC_HTTP=https://demo.example.com
services:
  session-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: session-host
    ports:
      - "27020:27020"
      - "27021:27021"
    environment:
      NL_BIND: "0.0.0.0"
      NL_HTTP_PORT: "27020"
      NL_WS_PORT: "27021"
      NL_DATA_ROOT: "/data"
      NL_PUBLIC_HOST: "127.0.0.1"
      NL_BUS_TOKEN: ${NL_BUS_TOKEN:-}
      # Uncomment for public demo (requires NL_BUS_TOKEN + NL_OPERATOR_KEY):
      # NL_PUBLIC_MODE: "true"
      # NL_OPERATOR_KEY: "replace-me"
      # NL_CORS_ORIGINS: "http://127.0.0.1:27020"
    volumes:
      - nl-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:27020/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  nl-data:
