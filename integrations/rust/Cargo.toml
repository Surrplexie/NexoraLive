[package]
name = "nl-bridge"
version = "0.1.0"
edition = "2021"
description = "NL Game Integration Spec v1 — reference bridge (WebSocket)"

[[bin]]
name = "nl_bridge"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
